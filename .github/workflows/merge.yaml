name: Merge and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  publish:
    name: test-build-scan-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Lint
        run: ruff check backend/app backend/tests

      - name: Test
        run: pytest -q backend/tests

      - name: Scan for secrets via GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image metadata
        id: image
        shell: bash
        run: |
          repository="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${repository}"
          short_sha="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            version_tag="${version}"
          else
            version="$(awk -F'"' '/^appVersion:/ {print $2}' fastapi-chart/Chart.yaml)"
            if [[ -z "${version}" ]]; then
              version="$(awk '/^appVersion:/ {print $2}' fastapi-chart/Chart.yaml)"
            fi
            version="${version#v}"
            version="$(echo "${version}" | sed -E 's/-[0-9a-f]{7}$//')"
            version_tag="${version}-${short_sha}"
          fi

          if [[ -z "${version}" ]]; then
            echo "Could not determine image version." >&2
            exit 1
          fi

          version_tag="${version_tag//\//-}"

          echo "name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }} \
            -t ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version_tag }} \
            ./backend

      - name: Scanning Image via Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version_tag }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
          docker push ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version_tag }}

      - name: Update Helm chart image tag
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.version_tag }}
        run: |
          perl -0pi -e 's/(^appVersion:\s*).*$/${1}"$ENV{IMAGE_TAG}"/m' fastapi-chart/Chart.yaml
          perl -0pi -e 's/(^  tag:\s*).*$/${1}"$ENV{IMAGE_TAG}"/m' fastapi-chart/values-prod.yaml

      - name: Commit Helm chart image tag
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.version_tag }}
        run: |
          if git diff --quiet -- fastapi-chart/Chart.yaml fastapi-chart/values-prod.yaml; then
            echo "Helm chart image tag is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastapi-chart/Chart.yaml fastapi-chart/values-prod.yaml
          git commit -m "chore: update image tag to ${IMAGE_TAG} [skip ci]"
          git push
