name: Pull Request

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: lint-test-build-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Lint
        run: ruff check backend/app backend/tests

      - name: Test
        run: pytest -q backend/tests

      - name: Scan for secrets via GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t fastapi-backend:${{ github.sha }} ./backend

      - name: Scanning Image via Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fastapi-backend:${{ github.sha }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
