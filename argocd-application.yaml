apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/dogruEymen/devops-internship-case.git
    targetRevision: main
    path: fastapi-chart
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
